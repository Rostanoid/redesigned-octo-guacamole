<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фото блюд | Улица Орвелиани</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://commons.wikimedia.org">
  <link rel="preconnect" href="https://upload.wikimedia.org">
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .gallery-page {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto;
    }

    .gallery-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .gallery-head h1 {
      margin: 0;
      font-family: "Forum", serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      color: var(--green);
      line-height: 0.95;
    }

    .gallery-head p {
      max-width: 560px;
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .gallery-back {
      flex: 0 0 auto;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 12px;
      background: var(--green);
      color: #fffaf5;
      font-weight: 800;
    }

    .gallery-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0;
    }

    .gallery-tab {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-strong);
      color: var(--muted);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .gallery-tab.is-active {
      border-color: transparent;
      background: var(--wine);
      color: #fffaf5;
    }

    .dish-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .dish-card {
      min-height: 320px;
      overflow: hidden;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      box-shadow: 0 12px 34px rgba(74, 41, 25, 0.1);
      text-align: left;
      cursor: pointer;
    }

    .dish-card__image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: rgba(24, 95, 93, 0.08);
    }

    .dish-card__body {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .dish-card__category {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .dish-card__title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.3;
      color: var(--text);
    }

    .dish-card__kj {
      margin: 0;
      color: var(--wine);
      font-weight: 800;
    }

    .dish-modal__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 14px;
    }

    .dish-modal__pill {
      padding: 7px 10px;
      border-radius: 12px;
      background: rgba(24, 95, 93, 0.08);
      color: var(--green-deep);
      font-size: 0.85rem;
      font-weight: 800;
    }

    @media (max-width: 720px) {
      .gallery-head {
        align-items: stretch;
        flex-direction: column;
        padding: 22px;
      }

      .gallery-back {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="gallery-page">
    <header class="gallery-head">
      <div>
        <p class="eyebrow">Меню с фото</p>
        <h1>Фото блюд</h1>
        <p>Все позиции из списка собраны в карточки. Нажмите на блюдо, чтобы открыть модальное окно с крупным фото и энергетической ценностью.</p>
      </div>
      <a class="gallery-back" href="index.html#menu">Вернуться в меню</a>
    </header>

    <nav class="gallery-tabs" id="gallery-tabs" aria-label="Разделы меню"></nav>
    <section class="dish-grid" id="dish-grid" aria-live="polite"></section>
  </main>

  <div class="modal-overlay" id="dish-modal" role="dialog" aria-modal="true" aria-labelledby="dish-modal-title" aria-hidden="true">
    <div class="modal-window dish-modal" role="document">
      <button type="button" class="modal-close" id="dish-modal-close" aria-label="Закрыть окно">&times;</button>
      <div class="dish-modal__media">
        <img id="dish-modal-img" class="dish-modal__img" src="" alt="" width="720" height="480" decoding="async">
      </div>
      <div class="dish-modal__body">
        <h2 id="dish-modal-title" class="dish-modal__title"></h2>
        <div class="dish-modal__meta">
          <span id="dish-modal-category" class="dish-modal__pill"></span>
          <span id="dish-modal-kj" class="dish-modal__pill"></span>
        </div>
        <p id="dish-modal-desc" class="dish-modal__desc"></p>
      </div>
    </div>
  </div>

  <script src="food-data.js"></script>
  <script>
    (function () {
      const tabsEl = document.getElementById("gallery-tabs");
      const gridEl = document.getElementById("dish-grid");
      const modal = document.getElementById("dish-modal");
      const modalClose = document.getElementById("dish-modal-close");
      const modalImg = document.getElementById("dish-modal-img");
      const modalTitle = document.getElementById("dish-modal-title");
      const modalCategory = document.getElementById("dish-modal-category");
      const modalKj = document.getElementById("dish-modal-kj");
      const modalDesc = document.getElementById("dish-modal-desc");
      const dishes = window.foodDishes || [];
      const categories = ["Все"].concat(Array.from(new Set(dishes.map(function (dish) { return dish.category; }))));
      let activeCategory = "Все";
      let lastFocus = null;

      function renderTabs() {
        tabsEl.innerHTML = categories.map(function (category) {
          return '<button type="button" class="gallery-tab' + (category === activeCategory ? ' is-active' : '') + '" data-category="' + category + '">' + category + "</button>";
        }).join("");
      }

      function renderGrid() {
        const filtered = activeCategory === "Все" ? dishes : dishes.filter(function (dish) { return dish.category === activeCategory; });
        gridEl.innerHTML = filtered.map(function (dish, index) {
          return [
            '<button type="button" class="dish-card" data-index="' + dishes.indexOf(dish) + '">',
            '<img class="dish-card__image" src="' + dish.image + '" alt="' + dish.title + '" loading="lazy" decoding="async">',
            '<span class="dish-card__body">',
            '<span class="dish-card__category">' + dish.category + '</span>',
            '<strong class="dish-card__title">' + dish.title + '</strong>',
            '<span class="dish-card__kj">' + dish.kj + ' кДж</span>',
            '</span>',
            '</button>'
          ].join("");
        }).join("");
      }

      function openModal(dish) {
        lastFocus = document.activeElement;
        modalTitle.textContent = dish.title;
        modalCategory.textContent = dish.category;
        modalKj.textContent = dish.kj + " кДж";
        modalDesc.textContent = "Ориентировочная энергетическая ценность указана на ресторанную порцию.";
        modalImg.src = dish.image;
        modalImg.alt = dish.title;
        modal.classList.add("is-active");
        modal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        modalClose.focus();
      }

      function closeModal() {
        modal.classList.remove("is-active");
        modal.setAttribute("aria-hidden", "true");
        modalImg.removeAttribute("src");
        document.body.style.overflow = "";
        if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
      }

      tabsEl.addEventListener("click", function (event) {
        const button = event.target.closest(".gallery-tab");
        if (!button) return;
        activeCategory = button.getAttribute("data-category");
        renderTabs();
        renderGrid();
      });

      gridEl.addEventListener("click", function (event) {
        const card = event.target.closest(".dish-card");
        if (!card) return;
        const dish = dishes[Number(card.getAttribute("data-index"))];
        if (dish) openModal(dish);
      });

      modalClose.addEventListener("click", closeModal);
      modal.addEventListener("click", function (event) {
        if (event.target === modal) closeModal();
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && modal.classList.contains("is-active")) closeModal();
      });

      renderTabs();
      renderGrid();
    })();
  </script>
</body>
</html>
